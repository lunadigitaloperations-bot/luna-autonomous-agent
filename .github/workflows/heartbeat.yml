name: Luna Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run agent
        run: python main.py
